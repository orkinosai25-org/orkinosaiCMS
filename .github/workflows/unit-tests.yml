name: Post-Merge Unit Tests

# This workflow runs automated unit tests after each pull request is merged to the main branch.
# It ensures that merged code maintains quality and doesn't break existing functionality.

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore OrkinosaiCMS.sln
    
    - name: Build solution
      run: dotnet build OrkinosaiCMS.sln --configuration Release --no-restore
    
    - name: Run unit tests
      run: dotnet test OrkinosaiCMS.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: post-merge-test-results
        path: '**/test-results.trx'
        retention-days: 7
