<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Zoota AI Assistant Logo Concept 1 - Friendly Chat Bot -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCF2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)"/>
  
  <!-- Robot/AI head -->
  <rect x="60" y="60" width="80" height="70" rx="10" fill="white" opacity="0.95"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="85" r="8" fill="#0078D4"/>
  <circle cx="120" cy="85" r="8" fill="#0078D4"/>
  
  <!-- Antenna -->
  <line x1="100" y1="60" x2="100" y2="40" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="35" r="6" fill="#50E6FF"/>
  
  <!-- Smile/mouth -->
  <path d="M 75 105 Q 100 120 125 105" stroke="#0078D4" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Chat bubble accent -->
  <path d="M 140 130 L 150 140 L 145 130 Z" fill="white" opacity="0.95"/>
  
  <!-- Sparkle effects -->
  <circle cx="45" cy="55" r="3" fill="#50E6FF"/>
  <circle cx="155" cy="145" r="4" fill="#50E6FF"/>
  <circle cx="160" cy="60" r="2" fill="white" opacity="0.8"/>
  <circle cx="40" cy="140" r="2" fill="white" opacity="0.8"/>
</svg>
