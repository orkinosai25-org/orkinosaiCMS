<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Zoota AI Assistant Logo">
  <title>Zoota AI Assistant - Professional Neural Network</title>
  <!-- Zoota AI Assistant Logo Concept 3 - Professional Icon -->
  <defs>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0090D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCF2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#50E6FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#50E6FF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="95" fill="url(#glow3)"/>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="85" fill="url(#gradient3)"/>
  
  <!-- AI Brain/Neural network pattern -->
  <g opacity="0.95" fill="white">
    <!-- Center node -->
    <circle cx="100" cy="100" r="12"/>
    
    <!-- Ring 1 nodes -->
    <circle cx="100" cy="60" r="8"/>
    <circle cx="130" cy="80" r="8"/>
    <circle cx="130" cy="120" r="8"/>
    <circle cx="100" cy="140" r="8"/>
    <circle cx="70" cy="120" r="8"/>
    <circle cx="70" cy="80" r="8"/>
    
    <!-- Ring 2 nodes (smaller) -->
    <circle cx="100" cy="40" r="5"/>
    <circle cx="145" cy="70" r="5"/>
    <circle cx="145" cy="130" r="5"/>
    <circle cx="100" cy="160" r="5"/>
    <circle cx="55" cy="130" r="5"/>
    <circle cx="55" cy="70" r="5"/>
  </g>
  
  <!-- Connection lines -->
  <g opacity="0.6" stroke="white" stroke-width="2" fill="none">
    <!-- From center to ring 1 -->
    <line x1="100" y1="100" x2="100" y2="60"/>
    <line x1="100" y1="100" x2="130" y2="80"/>
    <line x1="100" y1="100" x2="130" y2="120"/>
    <line x1="100" y1="100" x2="100" y2="140"/>
    <line x1="100" y1="100" x2="70" y2="120"/>
    <line x1="100" y1="100" x2="70" y2="80"/>
    
    <!-- From ring 1 to ring 2 -->
    <line x1="100" y1="60" x2="100" y2="40"/>
    <line x1="130" y1="80" x2="145" y2="70"/>
    <line x1="130" y1="120" x2="145" y2="130"/>
    <line x1="100" y1="140" x2="100" y2="160"/>
    <line x1="70" y1="120" x2="55" y2="130"/>
    <line x1="70" y1="80" x2="55" y2="70"/>
  </g>
  
  <!-- Chat symbol accent -->
  <g transform="translate(140, 40)">
    <rect x="0" y="0" width="30" height="20" rx="5" fill="white" opacity="0.9"/>
    <path d="M 5 15 L 10 20 L 10 15 Z" fill="white" opacity="0.9"/>
    <line x1="8" y1="7" x2="22" y2="7" stroke="#0078D4" stroke-width="2"/>
    <line x1="8" y1="13" x2="18" y2="13" stroke="#0078D4" stroke-width="2"/>
  </g>
</svg>
